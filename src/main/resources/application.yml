spring:
  application:
    name: legacybridge

  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:legacybridge};encrypt=true;trustServerCertificate=true
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:Legacybridge#1}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# jwt.secret: SOLO valor de desarrollo. En cualquier entorno real debe venir
# de una variable de entorno (JWT_SECRET) o un vault, nunca del repositorio.
jwt:
  secret: ${JWT_SECRET:dev-only-secret-legacybridge-please-override-in-prod-64chars!!}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
